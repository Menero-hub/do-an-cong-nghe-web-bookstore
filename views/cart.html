<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - D2TP book</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="top-bar">
  <div class="top-bar-inner">
    <div>Chào mừng bạn đến với hệ thống nhà sách D2TP book!</div>
    <div class="top-bar-links">
      <a href="/promotions">Khuyến mãi</a>
      <a href="/about">Hệ thống nhà sách</a>
      <a href="#" onclick="ChatWidget.open(); return false;">Hỗ trợ khách hàng</a>
    </div>
  </div>
</div>
<header>
  <div class="header-inner">
    <a href="/" class="logo">
      <div class="logo-box">
        <div class="logo-d2t">D2TP</div>
        <div class="logo-book">BOOK</div>
      </div>
    </a>
    <div class="header-search">
      <input id="nav-search" type="text" placeholder="Tìm kiếm sách, tác giả, nhà xuất bản...">
      <button onclick="const q=document.getElementById('nav-search').value; if(q) window.location.href='/books?search='+encodeURIComponent(q)">🔍</button>
    </div>
    <div class="header-actions">
      <div class="user-menu-wrap" id="user-menu" style="display:none;">
        <a href="#" class="header-btn" onclick="toggleDropdown(); return false;">
          <span class="icon">😊</span>
          <span id="user-name">Tài khoản</span>
        </a>
        <div class="user-dropdown" id="user-dropdown">
          <a href="/orders">📦 Đơn hàng của tôi</a>
          <a href="/admin" class="admin-link" style="display:none;">⚙️ Quản trị hệ thống</a>
          <a href="#" class="danger" onclick="Auth.logout(); return false;">🚪 Đăng xuất</a>
        </div>
      </div>
      <a href="/login" class="header-btn" id="login-link">
        <span class="icon">👤</span>
        <span>Đăng nhập</span>
      </a>
      <a href="/cart" class="header-btn cart-btn">
        <span class="icon">🛒</span>
        <span>Giỏ hàng</span>
        <span class="cart-count" id="cart-badge" style="display:none">0</span>
      </a>
    </div>
  </div>
</header>
<div class="page-header">
  <div class="container"><div><h1>🛒 Giỏ hàng của bạn</h1></div></div>
</div>

<section class="section">
  <div class="container" id="cart-container"></div>
</section>

<script src="/js/app.js"></script>
<script>
function renderCart() {
  const cart = Cart.get();
  const container = document.getElementById('cart-container');

  if (!cart.length) {
    container.innerHTML = `
      <div class="empty-cart">
        <div class="icon">🛒</div>
        <h3>Giỏ hàng trống</h3>
        <p>Hãy thêm sách vào giỏ hàng để tiếp tục mua sắm</p>
        <a href="/books" class="btn btn-gold" style="background:var(--red);color:white;padding:10px 20px;border-radius:4px;display:inline-block;margin-top:10px;">📚 Khám phá sách</a>
      </div>`;
    return;
  }

  const subtotal = Cart.total();
  const shipping = subtotal >= 300000 ? 0 : 30000;
  const total = subtotal + shipping;

  container.innerHTML = `
    <div class="cart-layout">
      <div>
        <h3 style="font-family:'Playfair Display',serif; color:var(--brown); margin-bottom:1rem;">${Cart.count()} sản phẩm</h3>
        <div id="cart-items">
          ${cart.map(item => `
            <div class="cart-item" id="item-${item.bookId}">
              <img src="${item.cover}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/80x107/f5ede0/6b3f1a?text=📚'">
              <div class="cart-item-info">
                <h4><a href="/book/${item.bookId}" style="color:inherit;text-decoration:none;">${item.title}</a></h4>
                <div class="author">${item.author}</div>
                <div style="color:var(--red); font-weight:700; font-size:0.95rem; margin-top:0.25rem;">${fmt.price(item.price)}</div>
                <div class="cart-item-controls" style="margin-top:0.5rem; display:flex; gap:10px; align-items:center;">
                  <button class="qty-btn" onclick="updateQty(${item.bookId}, ${item.quantity - 1})" style="width:25px;height:25px;">−</button>
                  <span class="qty-display">${item.quantity}</span>
                  <button class="qty-btn" onclick="updateQty(${item.bookId}, ${item.quantity + 1})" style="width:25px;height:25px;">+</button>
                  <button class="remove-btn" onclick="removeItem(${item.bookId})" style="margin-left:10px;background:none;border:none;color:var(--muted);cursor:pointer;">🗑️ Xóa</button>
                </div>
              </div>
              <div class="cart-item-price" style="font-weight:bold; color:var(--red);">${fmt.price(item.price * item.quantity)}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="order-summary" style="background:white; padding:20px; border-radius:8px; border:1px solid var(--border);">
        <h3 style="margin-bottom:15px; border-bottom:2px solid var(--red); padding-bottom:10px;">Tổng đơn hàng</h3>
        <div class="summary-row" style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>Tạm tính</span><span>${fmt.price(subtotal)}</span></div>
        <div class="summary-row" style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>Phí vận chuyển</span><span>${shipping === 0 ? '<span style="color:green">Miễn phí</span>' : fmt.price(shipping)}</span></div>
        ${shipping > 0 ? `<div style="font-size:0.78rem; color:var(--muted); margin-bottom:0.5rem;">Mua thêm ${fmt.price(300000 - subtotal)} để được miễn phí ship</div>` : ''}
        <div class="summary-row total" style="display:flex; justify-content:space-between; margin-top:15px; padding-top:15px; border-top:1px solid var(--border); font-size:18px; font-weight:bold;"><span>Tổng cộng</span><span style="color:var(--red);">${fmt.price(total)}</span></div>
        <button class="btn-checkout" onclick="goCheckout()" style="width:100%; padding:12px; background:var(--red); color:white; border:none; border-radius:4px; font-weight:bold; margin-top:20px; cursor:pointer;">Tiến hành thanh toán →</button>
        <a href="/books" style="display:block; text-align:center; margin-top:1rem; font-size:0.85rem; color:var(--muted); text-decoration:none;">← Tiếp tục mua sắm</a>
      </div>
    </div>`;
}

function updateQty(id, qty) {
  Cart.updateQty(id, qty);
  renderCart();
}

function removeItem(id) {
  Cart.remove(id);
  renderCart();
  Toast.show('Đã xóa sản phẩm khỏi giỏ hàng');
}

function goCheckout() {
  if (!Auth.isLoggedIn()) {
    Toast.show('⚠️ Vui lòng đăng nhập để thanh toán', 'error');
    setTimeout(() => window.location.href = '/login', 1000);
    return;
  }
  window.location.href = '/checkout';
}

renderCart();
</script>
</body>
</html>
